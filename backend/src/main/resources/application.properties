# ========================================================
# JobConnect Spring Boot Application Configuration
# ========================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=jobconnect-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/job_portal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Configuration (HMAC SHA-256 requires minimum 256-bit key)
app.jwt.secret=JobConnectSuperSecretSecureKeyWithAtLeast256BitsLengthForHmacSHA256JobPortal
app.jwt.expiration-ms=86400000

# File Upload / Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
