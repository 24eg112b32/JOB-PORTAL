<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JobConnect</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-briefcase-fill text-primary"></i>
        <span>Job<span class="text-dark">Connect</span></span>
      </a>
      <div class="ms-auto">
        <a href="register.html" class="btn btn-outline-primary btn-sm">Don't have an account? Sign Up</a>
      </div>
    </div>
  </nav>

  <!-- Login Form Section -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="category-icon mx-auto mb-3"><i class="bi bi-person-lock"></i></div>
        <h3 class="fw-bold mb-1">Welcome Back</h3>
        <p class="text-muted small mb-0">Sign in to your JobConnect account to continue</p>
      </div>

      <div class="auth-card-body">
        <form id="login-form">
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Sign In
          </button>

          <!-- Quick Test Demo Credentials Box -->
          <div class="demo-accounts-box">
            <div class="fw-bold text-success mb-1">
              <i class="bi bi-info-circle me-1"></i> Quick Test Accounts (Click to autofill):
            </div>
            <div class="d-flex flex-wrap gap-2">
              <div class="demo-account-chip" onclick="autofill('seeker@demo.com', 'password123')">
                <i class="bi bi-person me-1"></i> Job Seeker (seeker@demo.com)
              </div>
              <div class="demo-account-chip" onclick="autofill('recruiter@demo.com', 'password123')">
                <i class="bi bi-building me-1"></i> Recruiter (recruiter@demo.com)
              </div>
            </div>
          </div>
        </form>
      </div>

      <div class="auth-card-footer">
        Don't have an account? <a href="register.html" class="fw-semibold text-primary">Register here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function autofill(email, password) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = password;
    }
  </script>
</body>
</html>
