<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Job - JobConnect</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar sticky-top">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-briefcase-fill text-primary"></i>
        <span>Job<span class="text-dark">Connect</span></span>
        <span class="badge bg-success-subtle text-success ms-2 fs-6 fw-normal">Recruiter Portal</span>
      </a>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center" id="nav-auth-section">
        <!-- Auth Navbar Items -->
      </ul>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-heading">Recruitment Menu</div>
      <a href="recruiter-dashboard.html" class="sidebar-nav-link">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="post-job.html" class="sidebar-nav-link active">
        <i class="bi bi-plus-circle"></i> Post New Job
      </a>
      <a href="manage-jobs.html" class="sidebar-nav-link">
        <i class="bi bi-briefcase"></i> Manage Jobs
      </a>
      <a href="applicants.html" class="sidebar-nav-link">
        <i class="bi bi-people"></i> View Applicants
      </a>
      <a href="company-profile.html" class="sidebar-nav-link">
        <i class="bi bi-building"></i> Company Profile
      </a>

      <div class="sidebar-heading mt-4">Account</div>
      <a href="javascript:void(0)" onclick="Auth.logout()" class="sidebar-nav-link text-danger">
        <i class="bi bi-box-arrow-right text-danger"></i> Logout
      </a>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-content">
      <div class="mb-4">
        <h2 class="fw-bold mb-1">Post a New Position</h2>
        <p class="text-muted mb-0">Publish an opening to connect with qualified software developers and professionals.</p>
      </div>

      <div class="dash-card">
        <div class="dash-card-header">
          <h5 class="dash-card-title"><i class="bi bi-file-earmark-plus me-2 text-primary"></i> Job Details Form</h5>
        </div>
        <div class="dash-card-body">
          <form id="post-job-form" onsubmit="Recruiter.postJob(event)">
            <!-- Title & Company -->
            <div class="row g-3 mb-3">
              <div class="col-md-7">
                <label for="job-title" class="form-label fw-semibold">Job Title *</label>
                <input type="text" class="form-control" id="job-title" required placeholder="e.g. Senior Java Spring Boot Developer">
              </div>
              <div class="col-md-5">
                <label for="job-company" class="form-label fw-semibold">Company Name</label>
                <input type="text" class="form-control" id="job-company" placeholder="Leave blank to use company profile name">
              </div>
            </div>

            <!-- Job Type, Location & Experience -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="job-type" class="form-label fw-semibold">Job Type *</label>
                <select id="job-type" class="form-select" required>
                  <option value="FULL_TIME">Full Time</option>
                  <option value="PART_TIME">Part Time</option>
                  <option value="INTERNSHIP">Internship</option>
                  <option value="REMOTE">Remote</option>
                  <option value="CONTRACT">Contract</option>
                </select>
              </div>
              <div class="col-md-4">
                <label for="job-location" class="form-label fw-semibold">Job Location *</label>
                <input type="text" class="form-control" id="job-location" required placeholder="e.g. San Francisco, CA or Remote">
              </div>
              <div class="col-md-4">
                <label for="job-experience" class="form-label fw-semibold">Experience Required *</label>
                <input type="text" class="form-control" id="job-experience" required placeholder="e.g. 3-5 Years or Freshers">
              </div>
            </div>

            <!-- Salary, Openings & Deadline -->
            <div class="row g-3 mb-3">
              <div class="col-md-4">
                <label for="job-salary" class="form-label fw-semibold">Offered Salary</label>
                <input type="text" class="form-control" id="job-salary" placeholder="e.g. $110,000 - $135,000 / yr">
              </div>
              <div class="col-md-4">
                <label for="job-openings" class="form-label fw-semibold">Number of Openings *</label>
                <input type="number" class="form-control" id="job-openings" value="1" min="1" required>
              </div>
              <div class="col-md-4">
                <label for="job-deadline" class="form-label fw-semibold">Application Deadline *</label>
                <input type="date" class="form-control" id="job-deadline" required>
              </div>
            </div>

            <!-- Skills -->
            <div class="mb-3">
              <label for="job-skills" class="form-label fw-semibold">Required Skills *</label>
              <input type="text" class="form-control" id="job-skills" required placeholder="e.g. Java, Spring Boot, MySQL, REST API, Docker">
              <small class="text-muted">Separate multiple skills with commas</small>
            </div>

            <!-- Description -->
            <div class="mb-3">
              <label for="job-description" class="form-label fw-semibold">Job Description *</label>
              <textarea class="form-control" id="job-description" rows="4" required placeholder="Overview of the role, daily work, and project impact..."></textarea>
            </div>

            <!-- Requirements -->
            <div class="mb-4">
              <label for="job-requirements" class="form-label fw-semibold">Responsibilities & Requirements</label>
              <textarea class="form-control" id="job-requirements" rows="4" placeholder="Candidate qualifications, degree, communication skills, responsibilities..."></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="submit" id="btn-submit-job" class="btn btn-primary px-4 py-2">
                <i class="bi bi-send me-1"></i> Publish Job
              </button>
              <a href="manage-jobs.html" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/recruiter.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.requireAuth('ROLE_RECRUITER')) {
        // Set default minimum date for deadline to tomorrow
        const tomorrow = new Date(Date.now() + 86400000).toISOString().split('T')[0];
        document.getElementById('job-deadline').min = tomorrow;
        document.getElementById('job-deadline').value = new Date(Date.now() + 30 * 86400000).toISOString().split('T')[0];
      }
    });
  </script>
</body>
</html>
