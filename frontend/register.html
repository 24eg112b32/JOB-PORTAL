<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - JobConnect</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-briefcase-fill text-primary"></i>
        <span>Job<span class="text-dark">Connect</span></span>
      </a>
      <div class="ms-auto">
        <a href="login.html" class="btn btn-outline-primary btn-sm">Already have an account? Login</a>
      </div>
    </div>
  </nav>

  <!-- Register Form Section -->
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <div class="category-icon mx-auto mb-3"><i class="bi bi-person-badge"></i></div>
        <h3 class="fw-bold mb-1">Create Account</h3>
        <p class="text-muted small mb-0">Join JobConnect to find work or hire skilled engineers</p>
      </div>

      <div class="auth-card-body">
        <form id="register-form">
          <!-- Role Selector -->
          <label class="form-label fw-semibold d-block mb-2">Select Your Role</label>
          <div class="role-selector">
            <div class="role-option">
              <input type="radio" name="role" id="role-seeker" value="ROLE_JOB_SEEKER" checked>
              <label for="role-seeker" class="role-card-label">
                <i class="bi bi-person-walking"></i>
                <span>Job Seeker</span>
                <small>Looking for a job</small>
              </label>
            </div>
            <div class="role-option">
              <input type="radio" name="role" id="role-recruiter" value="ROLE_RECRUITER">
              <label for="role-recruiter" class="role-card-label">
                <i class="bi bi-building"></i>
                <span>Recruiter</span>
                <small>Hiring candidates</small>
              </label>
            </div>
          </div>

          <div class="mb-3">
            <label for="name" class="form-label fw-semibold">Full Name</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control" id="name" placeholder="John Doe" required minlength="2">
            </div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
          </div>

          <div class="row g-2 mb-4">
            <div class="col-md-6">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Min. 6 chars" required minlength="6">
              </div>
            </div>
            <div class="col-md-6">
              <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat password" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Create Account
          </button>
        </form>
      </div>

      <div class="auth-card-footer">
        Already registered? <a href="login.html" class="fw-semibold text-primary">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
