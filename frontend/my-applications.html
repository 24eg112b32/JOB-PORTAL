<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications - JobConnect</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg main-navbar sticky-top">
    <div class="container-fluid px-lg-4">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-briefcase-fill text-primary"></i>
        <span>Job<span class="text-dark">Connect</span></span>
        <span class="badge bg-primary-subtle text-primary ms-2 fs-6 fw-normal">Candidate</span>
      </a>

      <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center" id="nav-auth-section">
        <!-- Auth Navbar Items -->
      </ul>
    </div>
  </nav>

  <div class="dashboard-wrapper">
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-heading">Candidate Menu</div>
      <a href="seeker-dashboard.html" class="sidebar-nav-link">
        <i class="bi bi-speedometer2"></i> Dashboard
      </a>
      <a href="my-applications.html" class="sidebar-nav-link active">
        <i class="bi bi-file-earmark-check"></i> My Applications
      </a>
      <a href="seeker-profile.html" class="sidebar-nav-link">
        <i class="bi bi-person-lines-fill"></i> My Profile
      </a>
      <a href="jobs.html" class="sidebar-nav-link">
        <i class="bi bi-search"></i> Search Jobs
      </a>

      <div class="sidebar-heading mt-4">Account</div>
      <a href="javascript:void(0)" onclick="Auth.logout()" class="sidebar-nav-link text-danger">
        <i class="bi bi-box-arrow-right text-danger"></i> Logout
      </a>
    </aside>

    <!-- Main Content -->
    <main class="dashboard-content">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
        <div>
          <h2 class="fw-bold mb-1">My Applications</h2>
          <p class="text-muted mb-0">Track real-time candidate status and feedback from recruiters.</p>
        </div>
        <div>
          <span class="badge bg-white text-dark border p-2 shadow-sm">
            Total Submissions: <strong class="text-primary" id="total-applications-count">0</strong>
          </span>
        </div>
      </div>

      <div class="dash-card">
        <div class="table-responsive">
          <table class="table table-custom align-middle">
            <thead>
              <tr>
                <th>Job Title & Location</th>
                <th>Company</th>
                <th>Job Type</th>
                <th>Application Date</th>
                <th>Status</th>
                <th>Recruiter Notes</th>
              </tr>
            </thead>
            <tbody id="my-applications-body">
              <tr>
                <td colspan="6" class="text-center py-4">
                  <div class="spinner-border spinner-border-sm text-primary"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/applications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.requireAuth('ROLE_JOB_SEEKER')) {
        Applications.loadMyApplications();
      }
    });
  </script>
</body>
</html>
